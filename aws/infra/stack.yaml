AWSTemplateFormatVersion: "2010-09-09"
Description: >
  POD pipeline — VPC Lambda (container image). Primary trigger is event-driven:
  Sarathy invokes it asynchronously with {"trip_id": N} when a rider raises a
  POD verification request, and only that trip's images are scored. The daily
  EventBridge schedule is kept but DISABLED, for backfills / manual whole-dataset
  re-runs. No SAM. Deploy with aws/provision-stack.sh.

Parameters:
  Stage:
    Type: String
    Default: stg
    AllowedValues: [dev, stg, prod]

  SourceQuery:
    Type: String
    Default: "SELECT awb, trip_id, pod FROM kaptaan WHERE tour_date = CURRENT_DATE"
    Description: >
      Backfill/batch only. SQL run against Postgres to read the day's POD rows.
      Must return an AWB column, a trip-id column, and a POD-links column
      (POD / pod / pod_link; comma-separated links are expanded). Same shape as
      TripQuery and RangeQuery, and defaulted here for the same reason — a query
      is code, so it belongs in review rather than in a CI settings form.

  TripQuery:
    Type: String
    Default: "SELECT awb, trip_id, pod FROM kaptaan WHERE trip_id = %(trip_id)s"
    Description: >
      Single-trip (event-driven) query. Same column contract as SourceQuery, and
      MUST keep the named %(trip_id)s placeholder — it is bound as a query
      parameter, never string-interpolated. If it returns no rows the handler
      falls back to the pod_links carried in the trigger event.

  RangeQuery:
    Type: String
    Default: "SELECT awb, trip_id, pod FROM kaptaan WHERE tour_date BETWEEN %(start_date)s AND %(end_date)s"
    Description: >
      Backfill by date range, used when the trigger event carries start_date /
      end_date. MUST keep the named %(start_date)s and %(end_date)s placeholders —
      they are bound as query parameters, never string-interpolated.

  AllowAdhocQuery:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Allow a trigger event to carry raw SQL. It is validated as a single
      read-only SELECT/WITH before it reaches Postgres; set false to refuse
      ad-hoc SQL entirely.

  RescoreLookbackDays:
    Type: Number
    Default: 30
    Description: >
      A POD link already scored within this many days is not re-downloaded when
      a rider re-raises a request. Keyed on the link, so replaced photos are
      always scored. 0 = never re-score a link.

  TripMaxDownloadWorkers:
    Type: String
    Default: "8"
    Description: Download threads for a single-trip run (a trip has few images)

  WarmPoolSize:
    Type: Number
    Default: 3
    Description: >
      Containers kept hot by the warmup schedule. 0 disables the warmer — set it
      to roughly the number of trips you expect to be scored concurrently.

  WarmupRate:
    Type: String
    Default: "rate(5 minutes)"
    Description: How often to ping the warm pool (Lambda reaps idle containers)

  BackfillSchedule:
    Type: String
    Default: "cron(15 0 * * ? *)"
    Description: >
      When the whole-dataset backfill sweep runs, read in BackfillTimezone —
      the default is 00:15 daily. Only fires when BackfillState is ENABLED.

  BackfillTimezone:
    Type: String
    Default: Asia/Kolkata
    Description: >
      IANA timezone for BackfillSchedule, so the expression reads in local time
      instead of needing a UTC conversion at the call site.

  BackfillState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Per-trip events are the live trigger, so the sweep ships off. Enable it
      only for a deliberate backfill — see the note on the schedule below.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365, 731, 1827, 3653]
    Description: >
      CloudWatch retention for the function's logs. Without an explicit log
      group Lambda creates one that never expires.

  AlarmEmail:
    Type: String
    Default: ""
    Description: >
      Optional address subscribed to the alarm topic. Leave empty to create the
      topic with no subscription and wire it up later.

  FlagThreshold:
    Type: String
    Default: "0.7"

  InferenceBatchSize:
    Type: String
    Default: "64"

  MaxDownloadWorkers:
    Type: String
    Default: "64"
    Description: Concurrent image download threads (tune vs source host 429s / NAT)

  WindowSize:
    Type: String
    Default: "800"
    Description: Images held in memory per window (bounds peak memory)

  ImagenetNormalize:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Apply ImageNet mean/std at inference (must match training preprocessing)

  PgHost:
    Type: String
    Description: PostgreSQL endpoint (source query + results both run here)

  PgPort:
    Type: String
    Default: "5432"

  PgDatabase:
    Type: String
    Default: pod_classifier

  PgUser:
    Type: String
    Default: postgres

  # Where the POD rows are READ from. Each of these inherits the PgX value above
  # when left empty. The common case is a sibling database on the same cluster
  # (POD rows in `kaptaan` in the app database, scores written elsewhere), which
  # needs SourcePgDatabase alone — Postgres cannot cross databases on a single
  # connection, so the handler dials a second one.
  SourcePgHost:
    Type: String
    Default: ""
    Description: Source DB endpoint. Empty = same as PgHost.

  SourcePgDatabase:
    Type: String
    Default: ""
    Description: Source database name (e.g. sarathy). Empty = same as PgDatabase.

  SourcePgUser:
    Type: String
    Default: ""
    Description: Empty = same as PgUser.

  SourcePgPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: Empty = same as PgPassword.

  PgPassword:
    Type: String
    NoEcho: true

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  ScorerImageUri:
    Type: String
    Description: Full ECR image URI tag for the Lambda container

  TmpEphemeralMB:
    Type: Number
    Default: 512

  ReservedConcurrency:
    Type: Number
    Default: 10
    Description: >
      Per-trip events arrive whenever riders request verification, so this is
      sized for concurrent trips rather than a single daily run. Also caps load
      on the source host and the DB. Must exceed WarmPoolSize, since warm pings
      hold slots too — leave headroom for batch runs and continuations.

  InvokerPrincipalArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Optional IAM principal ARNs (e.g. the Sarathy service role/user) granted
      lambda:InvokeFunction on this function. Leave empty if the caller's own
      IAM policy already allows it.

Conditions:
  HasInvokerPrincipal: !Not [!Equals [!Join ["", !Ref InvokerPrincipalArns], ""]]
  WarmPoolEnabled: !Not [!Equals [!Ref WarmPoolSize, 0]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: POD pipeline Lambda egress
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub pod-pipeline-fn-${Stage}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: SelfInvokeMetricsAndDLQ
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow           # bounded self-continuation
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:pod-pipeline-${Stage}
              - Effect: Allow           # coverage metrics
                Action: cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow           # dead-letter for exhausted async retries
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDLQ.Arn

  # Owned explicitly so retention is set. Left implicit, Lambda creates this log
  # group on first invoke with never-expire retention and CFN never deletes it.
  PodPipelineLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/pod-pipeline-${Stage}
      RetentionInDays: !Ref LogRetentionDays

  PodPipelineFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaExecutionRole
      - PodPipelineLogGroup
    Properties:
      FunctionName: !Sub pod-pipeline-${Stage}
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ImageUri: !Ref ScorerImageUri
      MemorySize: 10240          # ~6 vCPU — CPU is bought with memory
      Timeout: 900
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      DeadLetterConfig:
        TargetArn: !GetAtt PipelineDLQ.Arn
      EphemeralStorage:
        Size: !Ref TmpEphemeralMB   # in-memory design uses no /tmp; keep small
      Architectures:
        - x86_64
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          SOURCE_QUERY: !Ref SourceQuery
          TRIP_QUERY: !Ref TripQuery
          RANGE_QUERY: !Ref RangeQuery
          ALLOW_ADHOC_QUERY: !Ref AllowAdhocQuery
          RESCORE_LOOKBACK_DAYS: !Ref RescoreLookbackDays
          TRIP_MAX_DOWNLOAD_WORKERS: !Ref TripMaxDownloadWorkers
          WARM_FANOUT: !Ref WarmPoolSize
          FLAG_THRESHOLD: !Ref FlagThreshold
          MAX_DOWNLOAD_WORKERS: !Ref MaxDownloadWorkers
          WINDOW_SIZE: !Ref WindowSize
          INFERENCE_BATCH_SIZE: !Ref InferenceBatchSize
          IMAGENET_NORMALIZE: !Ref ImagenetNormalize
          CONTINUATION_SAFETY_MS: "90000"
          MAX_CONTINUATIONS: "5"
          PG_HOST: !Ref PgHost
          PG_PORT: !Ref PgPort
          PG_DATABASE: !Ref PgDatabase
          PG_USER: !Ref PgUser
          PG_PASSWORD: !Ref PgPassword
          SOURCE_PG_HOST: !Ref SourcePgHost
          SOURCE_PG_DATABASE: !Ref SourcePgDatabase
          SOURCE_PG_USER: !Ref SourcePgUser
          SOURCE_PG_PASSWORD: !Ref SourcePgPassword
          MODEL_PATH: /opt/model/best.pt
          INPUT_SIZE: "224"

  # Async retries: a timeout counts as a failure → AWS re-invokes; the resume
  # checkpoint makes each retry advance. Exhausted retries land in the DLQ.
  PodPipelineEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref PodPipelineFunction
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600

  PipelineDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub pod-pipeline-dlq-${Stage}
      MessageRetentionPeriod: 1209600   # 14 days

  # Lets Sarathy (or any listed principal) invoke this function directly.
  SarathyInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: HasInvokerPrincipal
    Properties:
      FunctionName: !Ref PodPipelineFunction
      Action: lambda:InvokeFunction
      Principal: !Select [0, !Ref InvokerPrincipalArns]

  SchedulerInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PodPipelineFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub pod-pipeline-scheduler-${Stage}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePodPipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PodPipelineFunction.Arn

  # Keeps WarmPoolSize containers hot. A cold container pays for the image pull,
  # the torch import and the checkpoint load; riders trigger scoring at
  # unpredictable times, so we pay that on a schedule instead of on the request.
  # This is the cheap option — for a hard latency floor use provisioned
  # concurrency on an alias instead (see aws/README.md).
  WarmupSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: WarmPoolEnabled
    Properties:
      Name: !Sub pod-scoring-warmup-${Stage}
      Description: Keep the POD scorer warm so rider-triggered scoring skips the cold start
      State: ENABLED
      ScheduleExpression: !Ref WarmupRate
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt PodPipelineFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"warmup": true, "fanout": ${WarmPoolSize}}'
        RetryPolicy:
          MaximumRetryAttempts: 0

  # Whole-dataset sweep, kept for backfills and shipped DISABLED: scoring is
  # driven per trip by Sarathy's POD verification request.
  #
  # Before enabling it, note two things. The batch path's resume checkpoint is
  # scoped to run_date, while the 30-day link de-dup only guards the single-trip
  # path — so a nightly sweep re-scores links that per-trip runs already handled
  # on earlier days. And it competes with live per-trip events for the same
  # ReservedConcurrency. For a one-off backfill, prefer a date range through
  # Sarathy's trigger API over turning this on.
  DailySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub pod-scoring-daily-${Stage}
      Description: !Sub "Backfill sweep (whole dataset) — ${BackfillSchedule} ${BackfillTimezone}"
      State: !Ref BackfillState
      ScheduleExpression: !Ref BackfillSchedule
      ScheduleExpressionTimezone: !Ref BackfillTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt PodPipelineFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  # ----------------------------------------------------------------------- #
  # Alerting. The pipeline already emits the signals; without these nobody is
  # subscribed to them.
  # ----------------------------------------------------------------------- #

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub pod-pipeline-alarms-${Stage}
      DisplayName: !Sub POD pipeline alarms (${Stage})

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # Scoring failed outright — an unhandled exception, or async retries running out.
  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub pod-pipeline-errors-${Stage}
      AlarmDescription: The scorer raised errors — trips are not being scored.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PodPipelineFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The warm pool and live per-trip events share ReservedConcurrentExecutions.
  # Throttles mean that ceiling is now dropping real work.
  FunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub pod-pipeline-throttles-${Stage}
      AlarmDescription: >
        Invocations are being throttled — raise ReservedConcurrency or lower
        WarmPoolSize.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref PodPipelineFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Anything here has exhausted its retries and will never be scored on its own.
  DlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub pod-pipeline-dlq-${Stage}
      AlarmDescription: Events landed in the dead-letter queue and need replaying.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PipelineDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A batch run gave up with images neither scored nor recorded as failed.
  UncoveredImagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub pod-pipeline-uncovered-${Stage}
      AlarmDescription: >
        A batch run ended with images left uncovered — it ran out of
        continuations before finishing.
      Namespace: PODPipeline
      MetricName: ImagesUncovered
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  PodPipelineFunctionArn:
    Value: !GetAtt PodPipelineFunction.Arn
  PodPipelineFunctionName:
    Value: !Ref PodPipelineFunction
  ScheduleName:
    Value: !Ref DailySchedule
  ScheduleArn:
    Value: !GetAtt DailySchedule.Arn
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  DeadLetterQueueUrl:
    Value: !Ref PipelineDLQ
  LogGroupName:
    Value: !Ref PodPipelineLogGroup
