# POD Verifier — self-bootstrapping CI/CD for the container Lambda.
#
# Merge to a branch, and CI creates everything the service needs from nothing:
#
#     stag-main   → staging  (us-east-2, pod-scoring-stg)   automatic
#     prod-main   → prod     (ap-south-1, pod-scoring-prod) manual approval
#     every other branch     build + test only, no AWS writes
#
# The release job is idempotent and safe on an empty account. In order it:
#   1. preflight       — fail fast, listing every missing context variable
#   2. build + push    — creates the ECR repository if it does not exist
#   3. cloudformation  — creates or updates the stack, pointed at this commit's
#                        image tag, so CFN is the only thing that sets the
#                        function's image (no separate update-function-code race)
#   4. smoke           — a warm ping, then verifies the live image tag
#
# There is no manual "create the ECR repo" step any more, and no schema step at
# all: pod_scores belongs to sarathy and is created by sarathy's Flyway
# migration V198. What CI cannot invent is the platform it sits on: the VPC,
# the subnets and sarathy's internal endpoint. Those come from the context and
# preflight names them.
#
# ---------------------------------------------------------------------------
# CircleCI contexts — the growsimplee org's existing ones, same as sarathy uses:
#
#   Aws-stage, Aws-stage-extra   (stag-main workflow)
#   Aws-prod,  Aws-prod-extra    (prod-main workflow)
#
# Those contexts name their credentials ACCESS_KEY_ID / AWS_ACCESS_KEY (the
# second holds the SECRET, despite the name) rather than the standard
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. The configure-aws step below
# accepts either spelling, so nothing has to be renamed in the org.
#
# IAM: those keys were provisioned for sarathy's build-and-push. This pipeline
# additionally needs CloudFormation, IAM (it creates two roles), Logs, SNS,
# CloudWatch alarms, SQS, EC2 (security group + VPC ENIs), Scheduler and
# lambda:InvokeFunction. If the release job fails with AccessDenied, that is
# why — widen the policy rather than working around it here.
#
# Each context must ALSO provide these, which are specific to this service and
# will not already be there:
#   VPC_ID            vpc-…
#   SUBNET_IDS        subnet-a,subnet-b  (NAT egress + a route to sarathy)
#   SARATHY_BASE_URL  http://sarathy.internal:8080
#
# No database variables. This pipeline holds no DB credentials and issues no
# SQL: the function reads the rows to score from, and writes pod_scores back
# through, sarathy's /internal/pod-scoring API. Sarathy owns that schema and
# creates it with Flyway migration V198 — one service, one writer.
#
# SARATHY_BASE_URL must resolve and route from SUBNET_IDS, and must NOT be
# publicly reachable: /internal/pod-scoring is protected by network isolation
# alone and carries no app-level token.
#
# Optional, per context:
#   SARATHY_TIMEOUT SARATHY_RETRIES SARATHY_PAGE_SIZE
#   FLAG_THRESHOLD INFERENCE_BATCH_SIZE
#   MAX_DOWNLOAD_WORKERS TRIP_MAX_DOWNLOAD_WORKERS WINDOW_SIZE IMAGENET_NORMALIZE
#   WARM_POOL_SIZE WARMUP_RATE RESERVED_CONCURRENCY TMP_EPHEMERAL_MB
#   LOG_RETENTION_DAYS ALARM_EMAIL INVOKER_PRINCIPAL_ARNS
#
# Prefer OIDC over long-lived keys? Replace the aws-cli/setup step with
# aws-cli/setup: { role_arn: $AWS_ROLE_ARN, region: $AWS_REGION } and drop the keys.
# ---------------------------------------------------------------------------
version: 2.1

parameters:
  ecr_repository:
    type: string
    default: pod-pipeline
  # Set true from the CircleCI UI to re-apply the stack (an env-var-only change)
  # against the image already published as :latest — no rebuild, no redeploy.
  provision_only:
    type: boolean
    default: false

executors:
  # The image build needs a real Docker daemon with buildx, and the torch CPU
  # wheels make it heavy.
  docker-builder:
    machine:
      image: ubuntu-2404:current
      # docker_layer_caching: true   # paid feature — big win on rebuild time
    resource_class: medium
    working_directory: ~/project

commands:
  set-env:
    description: Resolve region/stage/stack for this environment and pin the image tag.
    parameters:
      aws_region: { type: string }
      stage:      { type: string }
      stack_name: { type: string }
      image_tag:  { type: string, default: "sha" }
    steps:
      - run:
          name: Export build environment
          command: |
            {
              echo 'export AWS_REGION="<< parameters.aws_region >>"'
              echo 'export AWS_DEFAULT_REGION="<< parameters.aws_region >>"'
              echo 'export ECR_REPOSITORY="<< pipeline.parameters.ecr_repository >>"'
              echo 'export STAGE="<< parameters.stage >>"'
              echo 'export STACK_NAME="<< parameters.stack_name >>"'
              if [ "<< parameters.image_tag >>" = "latest" ]; then
                echo 'export IMAGE_TAG="latest"'
              else
                echo "export IMAGE_TAG=\"${CIRCLE_SHA1:0:12}\""
              fi
              # Must match stack.yaml: FunctionName: !Sub pod-pipeline-${Stage}
              # (independent of the ECR repo name — do not derive it from that).
              echo "export LAMBDA_FUNCTION=\"pod-pipeline-<< parameters.stage >>\""
            } >> "$BASH_ENV"
      - run:
          name: Verify the trained checkpoint is present
          command: |
            test -f aws/lambda_scorer/model/best.pt \
              || { echo "aws/lambda_scorer/model/best.pt missing — it is baked into the image"; exit 1; }
            ls -lh aws/lambda_scorer/model/best.pt

  configure-aws:
    description: >
      Normalise credentials into the standard environment variables and pin the
      region for this deployment. The org contexts use ACCESS_KEY_ID and
      AWS_ACCESS_KEY (secret); the standard names are accepted too, so this
      works whichever way a context is set up.
    parameters:
      aws_region: { type: string }
    steps:
      - run:
          name: Configure AWS credentials and region
          command: |
            KEY_ID="${AWS_ACCESS_KEY_ID:-${ACCESS_KEY_ID:-}}"
            SECRET="${AWS_SECRET_ACCESS_KEY:-${AWS_ACCESS_KEY:-}}"
            if [ -z "${KEY_ID}" ] || [ -z "${SECRET}" ]; then
              echo "No AWS credentials in the context."
              echo "Expected ACCESS_KEY_ID + AWS_ACCESS_KEY (org convention),"
              echo "or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (standard)."
              exit 1
            fi
            # The deployment target is decided by the workflow, not the context.
            # A context region that disagrees usually means the context belongs
            # to a different environment than the branch does — say so loudly.
            if [ -n "${AWS_REGION:-}" ] && [ "${AWS_REGION}" != "<< parameters.aws_region >>" ]; then
              echo "WARNING: context AWS_REGION=${AWS_REGION} but this workflow deploys"
              echo "         to << parameters.aws_region >>. Using << parameters.aws_region >>."
            fi
            {
              echo "export AWS_ACCESS_KEY_ID=\"${KEY_ID}\""
              echo "export AWS_SECRET_ACCESS_KEY=\"${SECRET}\""
            } >> "$BASH_ENV"

            command -v aws >/dev/null 2>&1 || {
              echo "Installing AWS CLI v2"
              curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install --update
            }
            aws --version

  preflight:
    description: >
      Fail before touching AWS if the context is incomplete, naming every missing
      variable at once rather than one per re-run.
    steps:
      - run:
          name: Check required context variables
          command: |
            missing=""
            for v in VPC_ID SUBNET_IDS SARATHY_BASE_URL; do
              [ -n "${!v:-}" ] || missing="${missing} ${v}"
            done
            if [ -n "${missing}" ]; then
              echo "Missing from the CircleCI context:${missing}"
              echo "See the header of .circleci/config.yml for what each one is."
              exit 1
            fi
            echo "Context complete for ${STAGE} in ${AWS_REGION}."
            echo "Sarathy API: ${SARATHY_BASE_URL} (no direct DB access)"
            case "${SARATHY_BASE_URL}" in
              http://*|https://*) : ;;
              *) echo "SARATHY_BASE_URL must start with http:// or https://"; exit 1 ;;
            esac
            echo "Deploying as: $(aws sts get-caller-identity --query Arn --output text)"
            case "${SUBNET_IDS}" in
              *,*) : ;;
              *) echo "WARNING: SUBNET_IDS has a single subnet — no AZ redundancy." ;;
            esac
            # The org contexts set AWS_ACCOUNT_ID, and deploy.sh trusts it
            # verbatim rather than calling sts. A value from the wrong context
            # would push the image to another account's registry, so verify it
            # against the credentials actually in play.
            if [ -n "${AWS_ACCOUNT_ID:-}" ]; then
              REAL="$(aws sts get-caller-identity --query Account --output text)"
              if [ "${AWS_ACCOUNT_ID}" != "${REAL}" ]; then
                echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID} but these credentials are for ${REAL}."
                echo "The context and the credentials disagree — refusing to deploy."
                exit 1
              fi
              echo "AWS_ACCOUNT_ID matches the active credentials (${REAL})."
            fi
            [ -z "${SCORER_IMAGE_URI:-}" ] || \
              echo "WARNING: SCORER_IMAGE_URI is preset — CI derives this itself."

jobs:
  # Builds the exact image that ships, then runs the handler suite inside it so
  # pytest sees the pinned torch/timm/cv2 stack instead of a CI-only install.
  build-and-test:
    executor: docker-builder
    steps:
      - checkout
      - set-env: { aws_region: us-east-2, stage: stg, stack_name: unused }
      - run:
          name: Build image (DRY_RUN — no AWS calls)
          no_output_timeout: 30m
          command: |
            cd aws
            chmod +x deploy.sh provision-stack.sh teardown.sh
            DRY_RUN=true ./deploy.sh
      - run:
          name: The image must carry no database driver
          command: |
            docker run --rm --entrypoint /bin/bash \
              "pod-pipeline-local:${IMAGE_TAG}" -c \
              "! python -c 'import psycopg2' 2>/dev/null && python -c 'import sarathy_client; print(\"sarathy_client ok\")'"
      - run:
          name: pytest inside the built image
          command: |
            docker run --rm \
              -v "$PWD/aws/lambda_scorer:/work" -w /work \
              --entrypoint /bin/bash \
              "pod-pipeline-local:${IMAGE_TAG}" -c \
              "pip install --no-cache-dir -r requirements-dev.txt >/dev/null && python -m pytest -q --junitxml=/work/test-results/junit.xml"
      - store_test_results:
          path: aws/lambda_scorer/test-results
      - store_artifacts:
          path: aws/lambda_scorer/test-results

  # Everything needed to go from an empty account to a working service.
  release:
    executor: docker-builder
    parameters:
      aws_region: { type: string }
      stage:      { type: string }
      stack_name: { type: string }
      image_tag:  { type: string, default: "sha" }
      build:      { type: boolean, default: true }
    steps:
      - checkout
      - set-env:
          aws_region: << parameters.aws_region >>
          stage: << parameters.stage >>
          stack_name: << parameters.stack_name >>
          image_tag: << parameters.image_tag >>
      - configure-aws:
          aws_region: << parameters.aws_region >>
      - preflight

      - when:
          condition: << parameters.build >>
          steps:
            - run:
                name: Build, create the ECR repo if absent, push
                no_output_timeout: 30m
                command: |
                  cd aws
                  chmod +x deploy.sh
                  # CloudFormation owns the function's image, so never race it
                  # here — push only.
                  SKIP_LAMBDA_UPDATE=true ./deploy.sh
            - run:
                name: Also publish the :latest tag
                command: |
                  ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
                  REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                  docker tag "pod-pipeline-local:${IMAGE_TAG}" "${REGISTRY}/${ECR_REPOSITORY}:latest"
                  docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"

      - run:
          name: Deploy the stack (creates it on first run)
          no_output_timeout: 30m
          command: |
            cd aws
            chmod +x provision-stack.sh
            ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            export SCORER_IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
            ./provision-stack.sh

      - run:
          name: Smoke test — warm the function and verify the live image
          command: |
            aws lambda wait function-updated \
              --function-name "${LAMBDA_FUNCTION}" --region "${AWS_REGION}"
            aws lambda invoke \
              --function-name "${LAMBDA_FUNCTION}" --region "${AWS_REGION}" \
              --payload '{"warmup": true, "fanout": 1}' --cli-binary-format raw-in-base64-out \
              /tmp/warm.json >/dev/null
            python3 aws/ci/check_lambda_response.py /tmp/warm.json warm
            # The image URI lives on get-function (Code.ImageUri), NOT on
            # get-function-configuration — that API has no ImageUri field.
            LIVE="$(aws lambda get-function \
              --function-name "${LAMBDA_FUNCTION}" --region "${AWS_REGION}" \
              --query 'Code.ImageUri' --output text)"
            echo "live image: ${LIVE}"
            case "${LIVE}" in
              *":${IMAGE_TAG}") echo "OK — ${LAMBDA_FUNCTION} is on ${IMAGE_TAG}" ;;
              *) echo "MISMATCH — expected tag ${IMAGE_TAG}"; exit 1 ;;
            esac
      # Deliberately not invoking a real scoring run here: {} is a whole-dataset
      # sweep and {"trip_id": N} needs a trip that exists. See aws/DEPLOYMENT.md.

workflows:
  # ---- staging: merge to stag-main and CI does the rest ------------------- #
  staging:
    when:
      equal: [false, << pipeline.parameters.provision_only >>]
    jobs:
      - build-and-test:
          filters:
            branches:
              ignore: [prod-main]

      - release:
          name: release-staging
          context: [Aws-stage, Aws-stage-extra]
          requires: [build-and-test]
          aws_region: us-east-2
          stage: stg
          stack_name: pod-scoring-stg
          filters:
            branches:
              only: [stag-main]

  # ---- production: same pipeline, one click ------------------------------ #
  production:
    when:
      equal: [false, << pipeline.parameters.provision_only >>]
    jobs:
      - build-and-test:
          name: build-and-test-prod
          filters:
            branches:
              only: [prod-main]

      - hold-production:
          type: approval
          requires: [build-and-test-prod]
          filters:
            branches:
              only: [prod-main]

      - release:
          name: release-production
          context: [Aws-prod, Aws-prod-extra]
          requires: [hold-production]
          aws_region: ap-south-1
          stage: prod
          stack_name: pod-scoring-prod
          filters:
            branches:
              only: [prod-main]

  # ---- infra/env-var-only change, no rebuild ----------------------------- #
  # Trigger from the CircleCI UI with provision_only=true. Re-applies the stack
  # against whatever is already published as :latest.
  provision-only:
    when:
      equal: [true, << pipeline.parameters.provision_only >>]
    jobs:
      - hold-provision:
          type: approval
          filters:
            branches:
              only: [stag-main, prod-main]

      - release:
          name: reprovision-staging
          context: [Aws-stage, Aws-stage-extra]
          requires: [hold-provision]
          aws_region: us-east-2
          stage: stg
          stack_name: pod-scoring-stg
          image_tag: latest
          build: false
          filters:
            branches:
              only: [stag-main]

      - release:
          name: reprovision-production
          context: [Aws-prod, Aws-prod-extra]
          requires: [hold-provision]
          aws_region: ap-south-1
          stage: prod
          stack_name: pod-scoring-prod
          image_tag: latest
          build: false
          filters:
            branches:
              only: [prod-main]
